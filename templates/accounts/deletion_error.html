<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invalid Link — Life Pulse</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 20px; }
        h1 { font-size: 22px; color: #1a1a1a; margin-bottom: 12px; }
        p { font-size: 14px; color: #666; line-height: 1.6; margin-bottom: 24px; }
        a {
            display: inline-block;
            padding: 10px 24px;
            background: #e74c3c;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        a:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h1>Link Invalid or Expired</h1>
        <p>{{ error_message }}</p>
        <a href="/delete-account/">Request a New Link</a>
    </div>
</body>
</html>
